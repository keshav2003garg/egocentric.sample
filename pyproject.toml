[project]
name = "ego-sample-rerun"
version = "0.1.0"
description = "Builds a Rerun viewer file for one ego sample clip from its finished layer files."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rerun-sdk==0.41.0",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "opencv-python-headless",
]

[project.scripts]
ego-rerun = "ego_rerun.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ego_rerun"]
